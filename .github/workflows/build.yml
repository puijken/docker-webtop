name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Weekly, unlike the monthly run of the other container repos: Chrome, Edge and VS Code are
  # baked into the image and only update when it is rebuilt, and browsers ship security fixes
  # about weekly. The run also refreshes the base image, which is pinned by tag (Dependabot
  # can't see same-tag rebuilds). No `no-cache` is needed -- there is no layer cache configured
  # and `pull: true` below re-resolves the tag, so every build is already fully fresh.
  schedule:
    - cron: '0 1 * * 1'  # 01:00 UTC every Monday

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The image is ~4 GB; the stock runner is tight on disk for that.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No Buildx setup: the default docker driver builds straight into the local daemon, so the
      # smoke test can run the image without a second ~4 GB copy from `load: true`.
      # Smoke-tested before publishing, so a broken build never reaches :latest.
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          pull: true
          tags: ghcr.io/${{ github.repository }}:latest

      # The build stage before flattening, only to compare runtime config against (cached).
      - name: Build unflattened stage
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          target: build
          tags: docker-webtop:build

      - name: Smoke test
        run: ./smoke_test.sh ghcr.io/${{ github.repository }}:latest docker-webtop:build

      - name: Push Docker image
        run: docker push ghcr.io/${{ github.repository }}:latest

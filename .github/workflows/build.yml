name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Weekly, unlike the monthly run of the other container repos: Chrome, Edge and VS Code are
  # baked into the image and only update when it is rebuilt, and browsers ship security fixes
  # about weekly. The scheduled run also merges linuxserver's fedora-kde branch first, and the
  # base image is re-pulled every time (`pull: true`, no layer cache).
  schedule:
    - cron: '0 1 * * 1'  # 01:00 UTC every Monday

# One run at a time. A push build and the weekly run could otherwise overlap and publish
# :latest in the wrong order. A second run waits for the first instead of cancelling it.
concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # push the upstream merge
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Only on the schedule or a manual run. A push build builds what was pushed. The merge is
      # pushed back only after the image built and passed the smoke test, so a bad upstream change
      # leaves both main and :latest on the last good state, and the failed run emails the owner.
      - name: Merge upstream
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          ./sync-upstream.sh

      # The image is ~5 GB and is built twice (layered, then flattened).
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No Buildx setup: the default docker driver builds straight into the local daemon, where
      # flatten.sh and the smoke test can use the image without a `load: true` copy.
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          pull: true
          tags: docker-webtop:layered

      - name: Flatten
        run: ./flatten.sh docker-webtop:layered ghcr.io/${{ github.repository }}:latest

      - name: Smoke test
        run: ./smoke_test.sh ghcr.io/${{ github.repository }}:latest docker-webtop:layered

      # :latest plus a dated tag (UTC build day), so there is a known-good image to go back to
      # by name if a later build turns out bad. A second build on the same day replaces that
      # day's tag.
      - name: Push Docker image
        run: |
          image=ghcr.io/${{ github.repository }}
          dated="$image:$(date -u +%Y-%m-%d)"
          docker tag "$image:latest" "$dated"
          docker push "$image:latest"
          docker push "$dated"

      - name: Push upstream merge
        if: github.event_name != 'push'
        run: git push origin HEAD:main

      # Last, so a failure here can't hold back the image or the merge: keep the newest three
      # builds on ghcr.io (the current one and two to roll back to) and delete the rest.
      - name: Prune old image versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./prune-images.sh "${{ github.repository_owner }}" "${GITHUB_REPOSITORY#*/}" 3

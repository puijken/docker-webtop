name: Validate PR Build

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: docker-webtop:pr

      - name: Build unflattened stage
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          target: build
          tags: docker-webtop:build

      - name: Smoke test
        run: ./smoke_test.sh docker-webtop:pr docker-webtop:build
